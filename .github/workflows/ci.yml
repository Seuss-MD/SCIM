name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  app:
    name: App (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  functions:
    name: Cloud Functions (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    env:
      # functions/ uses a legacy .eslintrc; don't pick up the app's flat config
      ESLINT_USE_FLAT_CONFIG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
